<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Social Studio · Planejamento</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/layout-model.js" defer></script>
  <script src="/perfil-config.js" defer></script>
  <script src="/instagram.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/" aria-label="Social Studio, início"><span class="brand-mark" aria-hidden="true">S</span>Social <strong>Studio</strong></a>
    <div class="workspace"><span class="avatar">NTV</span><div><strong>NTV</strong><small>Conteúdo e produção</small></div><span class="check" aria-hidden="true">✓</span></div>
    <p class="nav-label">Workspace</p>
    <nav aria-label="Navegação principal">
      <button type="button" class="nav-item active" data-tela="planejamento" aria-label="Planejamento">Planejamento</button>
      <button type="button" class="nav-item" data-tela="producao" aria-label="Produção">Produção</button>
      <button type="button" class="nav-item" data-tela="publicar" aria-label="Publicar, 0 peças a publicar">Publicar <span id="contador-publicar" class="publish-count" aria-hidden="true">0</span></button>
    </nav>
    <div class="sidebar-bottom"><strong>Consulta local</strong><p>Somente neste computador</p></div>
  </aside>
  <header class="topbar">
    <button type="button" id="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">☰</button>
    <p>Workspace <span aria-hidden="true">/</span> <strong id="caminho">Planejamento</strong></p>
    <div class="topbar-actions"><span class="computer">Neste computador <span class="presence" aria-hidden="true"></span></span><button type="button" id="theme-toggle" aria-label="Ativar tema escuro">☾ Escuro</button></div>
  </header>
  <main>
    <div class="page-heading"><h1 id="titulo" tabindex="-1">Planejamento</h1><div class="capture-actions"><span id="selo" class="badge cinza" role="status">Carregando</span><button type="button" id="atualizar" class="refresh-button">⟳ Atualizar</button></div></div>
    <p id="resultado-atualizacao" role="status" aria-live="polite"></p>
    <p id="erro" role="alert" hidden></p>
    <section id="planejamento" aria-label="Planejamento" hidden>
      <div id="objetivo-mes" class="objective"><button type="button" id="objetivo-toggle" aria-expanded="false" aria-controls="pautas-mes"></button><div id="pautas-mes" hidden></div></div>
      <div class="month-heading"><div><h2 id="mes"></h2><p id="week-title"></p><span id="week-progress"></span></div><div class="month-nav"><button type="button" id="anterior" aria-label="Semana anterior">‹</button><button type="button" id="proximo" aria-label="Próxima semana">›</button></div></div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Formato"><button type="button" data-formato="Todos" class="active">Todos</button><button type="button" data-formato="Imagem">Imagem</button><button type="button" data-formato="Carrossel">Carrossel</button><button type="button" data-formato="Reels">Reels</button></div>
        <div class="views" role="group" aria-label="Visualização"><button type="button" data-modo="Semana">Semana</button><button type="button" data-modo="Mês">Mês</button></div>
      </div>
      <div id="sem-captura" class="empty" hidden><h3>Nenhuma captura disponível</h3></div>
      <div id="calendario" class="calendar"></div>
      <div id="lista" class="planning-week" role="region" aria-label="Semana, sete dias" tabindex="0"></div>
      <div class="calendar-footer"><span id="total"></span><button type="button" id="abrir-sem-data" class="text-button" hidden>0 sem data</button></div>
      <section id="sem-data" aria-label="Peças sem data" hidden><div class="section-heading"><h2>Sem data</h2><button type="button" id="fechar-sem-data">Fechar lista</button></div><div id="lista-sem-data"></div></section>
    </section>
    <section id="producao" aria-label="Projetos por semana" hidden>
      <p id="quadro-vazio" class="empty" hidden></p>
      <div id="quadro" class="production-projects"></div>
      <p id="quadro-total" class="board-total"></p>
    </section>
    <section id="publicar" aria-label="Publicar" hidden><div class="publish-layout"><section aria-label="Peças a publicar"><div id="fila-publicar"></div></section><aside class="publish-sidebar"><section aria-labelledby="publicadas-titulo"><h2 id="publicadas-titulo">Publicadas recentes</h2><div id="publicadas-recentes"></div></section><section aria-labelledby="travadas-titulo"><h2 id="travadas-titulo">Travadas</h2><div id="travadas"></div></section></aside></div></section>
  </main>
  <dialog id="dia" aria-labelledby="dia-titulo" aria-describedby="dia-quantidade"><header class="drawer-top"><div><small>NTV · Consulta do dia</small><h2 id="dia-titulo"></h2><p id="dia-quantidade"></p></div><button type="button" id="fechar-dia" aria-label="Fechar dia">×</button></header><div id="dia-pecas" class="drawer-body"></div></dialog>
</body>
</html>
